<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.titre if meta else "Lakehouse" }} · Lakehouse e-commerce</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav aria-label="Modules">
    <div class="marque">Lakehouse<small>Octobre 2019 · REES46</small></div>
    {% for m in modules %}
      <a href="/{{ m.slug }}/" class="{{ 'actif' if request.path.startswith('/' ~ m.slug) else '' }}">{{ m.titre }}</a>
    {% endfor %}
  </nav>
  <main>{% block contenu %}{% endblock %}</main>
</body>
</html>
